<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Light grey background -->
  <rect width="800" height="600" fill="hsl(var(--muted))" />

  <!-- Image icon -->
  <g transform="translate(350, 250)">
    <!-- Simple image/photo icon -->
    <rect x="0" y="0" width="100" height="80" rx="4" fill="hsl(var(--muted-foreground))" fill-opacity="0.3" stroke="hsl(var(--muted-foreground))" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Sun/circle in top left -->
    <circle cx="20" cy="20" r="8" fill="hsl(var(--muted-foreground))" fill-opacity="0.4"/>

    <!-- Mountain shape -->
    <path d="M0 60 L25 35 L50 50 L75 25 L100 60 Z" fill="hsl(var(--muted-foreground))" fill-opacity="0.4"/>
  </g>

  <!-- Text label -->
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="hsl(var(--muted-foreground))" fill-opacity="0.6">
    Image Placeholder
  </text>
</svg>
